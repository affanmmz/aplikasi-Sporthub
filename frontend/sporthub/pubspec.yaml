name: sporthub
description: Aplikasi pemesanan lapangan, sewa perlengkapan, komunitas, dan cari lawan tanding.
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  dio: ^5.4.3
  google_fonts: ^6.2.1
  qr_flutter: ^4.1.0
  intl: ^0.19.0
  geolocator: ^11.0.0
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true